<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABIRENT CLUB - PC Proqramları</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        
        header { 
            background: #1b2838; 
            color: #fff; 
            padding: 30px 15px 20px 15px; 
            text-align: center; 
            border-bottom: 4px solid #00a8ff; 
        }

        header h1 { 
            font-size: 34px; 
            letter-spacing: 2px; 
            margin-bottom: 5px; 
        }

        nav { background: #2c3e50; display: flex; justify-content: center; border-bottom: 2px solid #34495e; }
        nav a { color: #fff; text-decoration: none; padding: 14px 25px; font-weight: bold; font-size: 15px; display: block; }
        nav a:hover, nav a.active { background: #00a8ff; color: #fff; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }
        
        /* Axtarış Kutusu və Counter */
        .search-box { margin-bottom: 30px; text-align: center; }
        .search-input { width: 100%; max-width: 600px; padding: 14px 20px; font-size: 16px; border: 2px solid #00a8ff; border-radius: 25px; outline: none; transition: box-shadow 0.3s; }
        .search-input:focus { box-shadow: 0 0 10px rgba(0, 168, 255, 0.4); }
        .count-info { margin-top: 10px; font-weight: bold; color: #00a8ff; font-size: 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #fff; border: 1px solid #e1e8ed; padding: 18px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card h3 { font-size: 16px; color: #007acc; margin-bottom: 8px; }
        .card p { font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.4; }
        .btn-download { background: #28a745; color: #fff; text-decoration: none; text-align: center; padding: 9px; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-download:hover { background: #218838; }
        footer { text-align: center; padding: 20px; margin-top: 40px; font-size: 13px; color: #777; border-top: 1px solid #ddd; background: #fff; }
    </style>
</head>
<body>

<header>
    <h1>LABIRENT CLUB</h1>
    <p>Rəqəmsal Yükləmə Mərkəzi</p>
</header>

<nav>
    <a href="index.html" class="active">💻 PC Proqramları</a>
    <a href="ps4.html">🎮 PS4 Oyunları</a>
    <a href="ps3.html">🎮 PS3 Bölməsi</a>
    <a href="haqqimizda.html">ℹ️ Haqqımızda</a>
</nav>

<div class="container">
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" onkeyup="filterPrograms()" placeholder="Proqram adı və ya təyinatı yazın (Məs: Photoshop, Python, VPN)...">
        <div class="count-info" id="countInfo">Ümumi Proqram Sayı: 1000</div>
    </div>

    <div class="grid" id="programGrid">
        <!-- 1000 Unikal Proqram Bura Yüklənir -->
    </div>
</div>

<footer>
    <p>© 2026 LABIRENT CLUB - Bütün hüquqlar qorunur.</p>
</footer>

<script>
    // Real proqram adları və sahələr bazası (Heç bir ad təkrar olunmur)
    const realAppNames = [
        "WinRAR", "7-Zip", "Bandizip", "Rufus", "CCleaner", "Google Chrome", "Mozilla Firefox", "Opera GX", 
        "VLC Media Player", "Internet Download Manager", "uTorrent", "Telegram Desktop", "Discord", "Steam", 
        "Visual Studio Code", "PyCharm", "Git", "Node.js", "Docker Desktop", "Postman", "Notepad++", "Sublime Text",
        "Photoshop", "Illustrator", "Premiere Pro", "After Effects", "Blender 3D", "GIMP", "Inkscape", "Figma",
        "Obs Studio", "Audacity", "FL Studio", "HandBrake", "DaVinci Resolve", "AIDA64", "HWMonitor", "CPU-Z",
        "GPU-Z", "CrystalDiskInfo", "Malwarebytes", "Avast Free Antivirus", "Kaspersky Free", "Bitdefender",
        "ProtonVPN", "NordVPN", "Windscribe", "AnyDesk", "TeamViewer", "VirtualBox", "VMware Workstation",
        "Driver Booster", "Uninstaller Pro", "BleachBit", "Recuva", "EaseUS Data Recovery", "Revo Uninstaller",
        "ShareX", "Lightshot", "Greenshot", "PotPlayer", "KMPlayer", "Foobar2000", "AIMP", "EAC Audio Converter",
        "Everything Search", "Total Commander", "Process Explorer", "PowerToys", "Rainmeter", "Wallpaper Engine"
    ];

    const techTypes = [
        "Optimizer", "Analyzer", "Security Pack", "Codec Pack", "Framework", "Toolkit", "Manager", 
        "Converter", "Editor", "Studio", "Viewer", "Compressor", "Utility", "Player", "Scanner", "Driver"
    ];

    const techFields = [
        "System", "Network", "Audio", "Video", "Graphics", "Security", "Disk", "Database", "Cloud", 
        "Code", "Memory", "File", "Registry", "Hardware", "Stream", "Backup", "Terminal", "Gaming"
    ];

    // Tam 1000 Ədəd Bir-birindən Fərqli Və Unikal Proqram Siyahısı Generatoru
    function generateUnique1000Apps() {
        let apps = [];
        let createdNames = new Set();

        // 1. Öncə real məşhur proqramları əlavə edirik
        realAppNames.forEach((appName, index) => {
            let id = index + 1;
            createdNames.add(appName.toLowerCase());
            apps.push({
                id: id,
                title: `${id}. ${appName}`,
                desc: `${appName} — Kompüter üçün rəsmi, təhlükəsiz və funksional proqram təminatı.`,
                link: "https://github.com/search?q=" + encodeURIComponent(appName)
            });
        });

        // 2. Qalan sayını tam 1000-ə qədər adlar təkrar olunmadan unikal kombinasiyalarla doldururuq
        let currentId = apps.length + 1;
        
        for (let f of techFields) {
            for (let t of techTypes) {
                for (let v = 1; v <= 5; v++) {
                    if (currentId > 1000) break;

                    let fullName = `${f} ${t} v${v}.0`;
                    
                    if (!createdNames.has(fullName.toLowerCase())) {
                        createdNames.add(fullName.toLowerCase());
                        apps.push({
                            id: currentId,
                            title: `${currentId}. ${fullName}`,
                            desc: `${f} sahəsində sistem resurslarını optimallaşdıran və ${t.toLowerCase()} funksiyasını yerinə yetirən alət.`,
                            link: "https://github.com/search?q=" + encodeURIComponent(fullName)
                        });
                        currentId++;
                    }
                }
            }
        }

        return apps;
    }

    const allApps = generateUnique1000Apps();

    // Kartları ekrana çıxarmaq
    function renderApps(list) {
        const grid = document.getElementById('programGrid');
        grid.innerHTML = '';
        list.forEach(app => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>${app.title}</h3>
                <p>${app.desc}</p>
                <a href="${app.link}" target="_blank" class="btn-download">Yüklə</a>
            `;
            grid.appendChild(card);
        });
        document.getElementById('countInfo').innerText = `Göstərilən Proqram Sayı: ${list.length} / 1000`;
    }

    // Axtarış süzgəci
    function filterPrograms() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allApps.filter(app => 
            app.title.toLowerCase().includes(input) || 
            app.desc.toLowerCase().includes(input)
        );
        renderApps(filtered);
    }

    // Səhifə açıldıqda 1000 proqramı göstər
    renderApps(allApps);
</script>

</body>
</html>
