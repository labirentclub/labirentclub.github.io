<!DOCTYPE html>
<html lang="az">
<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        
        header { 
            background: #1e293b;

            border-bottom: 4px solid #0070d1;
        }

        header h1 { font-size: 32px; color: #38bdf8; letter-spacing: 1px; margin-bottom: 6px; }
        header p { color: #94a3b8; font-size: 14px; }

        nav { background: #0f172a; display: flex; justify-content: center; border-bottom: 1px solid #334155; }
        nav a { color: #f8fafc; text-decoration: none; padding: 14px 22px; font-weight: bold; font-size: 15px; transition: 0.2s; }
        nav a:hover, nav a.active { background: #0070d1; color: #fff; }

        .container { max-width: 1400px; margin: 25px auto; padding: 0 15px; }

        .search-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-input { 
            width: 100%; 
            max-width: 600px; 
            padding: 13px 20px; 
            font-size: 15px; 
            background: #1e293b;
            color: #fff;
            border: 2px solid #334155; 
            border-radius: 25px; 
            outline: none; 
            transition: all 0.3s; 
        }

        .search-input:focus { border-color: #0070d1; box-shadow: 0 0 12px rgba(0, 112, 209, 0.4); }
        .stats-counter { color: #38bdf8; font-weight: 600; font-size: 14px; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 18px; 
        }
        
        .card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            overflow: hidden;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, border-color 0.2s;
            height: 100%;
        }

        .card:hover { transform: translateY(-4px); border-color: #0070d1; }
        
        .card-img-wrapper {
            width: 100%;
            height: 160px;
            background-color: #0b1120;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body { 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex-grow: 1;
        }
        
        .badge { 
            display: inline-block; 
            font-size: 11px; 
            background: #0070d1; 
            color: #fff; 
            padding: 3px 8px; 
            border-radius: 4px; 
            margin-bottom: 8px; 
            width: fit-content; 
            font-weight: 600;
        }

        .card h3 { 
            font-size: 15px; 
            color: #ffffff; 
            margin-bottom: 8px; 
            line-height: 1.3; 
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card p { 
            font-size: 12px; 
            color: #94a3b8; 
            margin-bottom: 14px; 
            line-height: 1.4; 
            height: 48px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        
        .btn-whatsapp { 
            background: #25d366; 
            color: #fff; 
            text-decoration: none; 
            text-align: center; 
            padding: 9px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: bold; 
            transition: background 0.2s;
            display: block;
        }

        .btn-whatsapp:hover { background: #1da851; }

        footer { text-align: center; padding: 20px; margin-top: 40px; font-size: 13px; color: #64748b; background: #1e293b; border-top: 1px solid #334155; }
    </style>
</head>
<body>

        <!-- Oyunlar JS ilə Yüklənir -->

</div>

<footer>
    <p>© 2026 LABIRENT CLUB - Bütün hüquqlar qorunur.</p>

<script>
    const whatsappNumber = "994500000000"; 

    // Brauzerdə dərhal xətasız şəkil generasiya edən funksiya
    function generateGameImage(title, genre) {
        const canvas = document.createElement('canvas');
        canvas.width = 400;
        canvas.height = 250;
        const ctx = canvas.getContext('2d');

        // Arxa fon qradiyenti
        const gradient = ctx.createLinearGradient(0, 0, 400, 250);
        gradient.addColorStop(0, '#00439c');
        gradient.addColorStop(1, '#0f172a');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 400, 250);

        // Dekorativ xətlər
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(350, 50, 120, 0, 2 * Math.PI);
        ctx.stroke();

        // PS4 Bənd mətni
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px Segoe UI';
        ctx.fillText('PLAYSTATION 4', 25, 40);

        // Oyunun Adı
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Segoe UI';
        
        // Mətni iki sətirə bölmək üçün
        const words = title.split(' ');
        let line = '';
        let y = 110;
        
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > 340 && n > 0) {
                ctx.fillText(line, 25, y);
                line = words[n] + ' ';
                y += 30;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, 25, y);

        // Janr hissəsi
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px Segoe UI';
        ctx.fillText('Genre: ' + genre, 25, y + 45);

        return canvas.toDataURL('image/png');
    }

    const ps4Games = [

        { id: 2, title: "God of War Ragnarök", genre: "Aksiyon / Macəra", desc: "Kratos və Atreusun İskandinav mifologiyasının son döyüşünə qarşı mübarizəsi." },
        { id: 3, title: "Red Dead Redemption 2", genre: "Vəhşi Qərb", desc: "Arthur Morgan və Van der Linde dəstəsinin Vəhşi Qərbin son günlərindəki həyat mübarizəsi." },

        { id: 6, title: "The Last of Us Part I", genre: "Hekayə / Qorxu", desc: "Joel və Ellie-nin post-apokaliptik Amerika boyunca təhlükəli səyahəti." },

        { id: 17, title: "Elden Ring", genre: "RPG / Fantaziya", desc: "Elden Lordu olmaq üçün epik boss döyüşləri və azad kəşfiyyat." },
        { id: 18, title: "Tekken 7", genre: "Döyüş", desc: "Mishima ailəsinin son qarşıdurması, zəngin döyüşçü siyahısı." },
        { id: 19, title: "The Witcher 3: Wild Hunt", genre: "RPG / Açıq Dünya", desc: "Geralt of Rivia olaraq Qədim Qan övladı Ciri-ni tapmaq üçün bədheybətlərlə mübarizə." },
        { id: 20, title: "Batman: Arkham Knight", genre: "Aksiyon / Macəra", desc: "Gotham şəhərini qorumaq üçün Betmobil sürün və Scarecrow-a qarşı döyüşün." }
    ];

    function renderGames(data) {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';

        data.forEach(game => {
            const card = document.createElement('div');
            card.className = 'card';

            const message = encodeURIComponent(`Salam, LABIRENT CLUB! Mən PS4 üçün "${game.title}" oyununu əldə etmək istəyirəm.`);
            const waLink = `https://wa.me/${whatsappNumber}?text=${message}`;
            const generatedImage = generateGameImage(game.title, game.genre);

            card.innerHTML = `
                <div class="card-img-wrapper">
                    <img src="${generatedImage}" alt="${game.title}" class="card-img">
                </div>
                <div class="card-body">
                    <div>
                        <span class="badge">${game.genre}</span>
                        <h3>${game.id}. ${game.title}</h3>
                        <p>${game.desc}</p>
                    </div>
                    <a href="${waLink}" target="_blank" class="btn-whatsapp">
                        📱 Əldə et
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById('statsCounter').innerText = `Mövcud Oyun Sayı: ${data.length}`;
    }

    function filterGames() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let filtered = ps4Games.filter(g => 
            g.title.toLowerCase().includes(input) || 
            g.genre.toLowerCase().includes(input) ||
            g.desc.toLowerCase().includes(input)
        );
        renderGames(filtered);
    }

    renderGames(ps4Games);
</script>

</body>
