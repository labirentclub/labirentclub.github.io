<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABIRENT CLUB - PS4 Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #0d1117; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            text-align: center;
        }
        .card { 
            background: #161b22; 
            border: 2px solid #00a8ff; 
            border-radius: 12px; 
            padding: 40px; 
            width: 90%; 
            max-width: 450px; 
            box-shadow: 0 0 25px rgba(0, 168, 255, 0.25); 
        }
        h1 { 
            color: #00a8ff; 
            font-size: 28px; 
            letter-spacing: 2px; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            text-shadow: 0 0 10px rgba(0, 168, 255, 0.5);
        }
        p { 
            color: #8b949e; 
            font-size: 14px; 
            margin-bottom: 25px; 
        }
        .badge {
            background: #238636;
            color: #fff;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .btn-main { 
            background: #00a8ff; 
            color: #000; 
        }
        .btn-main:hover { 
            background: #0086cc; 
            color: #fff; 
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.5);
        }
        .btn-back { 
            background: #21262d; 
            color: #c9d1d9; 
            border: 1px solid #30363d; 
        }
        .btn-back:hover { 
            background: #30363d; 
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>LABIRENT CLUB</h1>
        <p>PS4 Resurs və Keçid Portalına Xoş Gəlmisiniz</p>
        <div class="badge">FW 11.50 - 13.02</div>
        
        <!-- Yönləndirmə Düyməsi -->
        <a href="https://raw-game.com/zrm/run_lapse.html" target="_blank" class="btn btn-main">🚀 Resursa Keçid Et</a>
        <a href="index.html" class="btn btn-back">💻 Ana Səhifəyə Qayıt</a>
    </div>

</body>
</html>
