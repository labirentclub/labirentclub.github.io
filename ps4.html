<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABIRENT CLUB - 500 PS4 Oyun Kataloqu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        
        header { 
            background: #1e293b; 
            padding: 30px 20px 20px 20px; 
            text-align: center; 
            border-bottom: 4px solid #0070d1;
        }

        header h1 { font-size: 32px; color: #38bdf8; letter-spacing: 1px; margin-bottom: 6px; }
        header p { color: #94a3b8; font-size: 14px; }

        nav { background: #0f172a; display: flex; justify-content: center; border-bottom: 1px solid #334155; }
        nav a { color: #f8fafc; text-decoration: none; padding: 14px 22px; font-weight: bold; font-size: 15px; transition: 0.2s; }
        nav a:hover, nav a.active { background: #0070d1; color: #fff; }

        .container { max-width: 1400px; margin: 25px auto; padding: 0 15px; }

        .search-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-input { 
            width: 100%; 
            max-width: 600px; 
            padding: 13px 20px; 
            font-size: 15px; 
            background: #1e293b;
            color: #fff;
            border: 2px solid #334155; 
            border-radius: 25px; 
            outline: none; 
            transition: all 0.3s; 
        }

        .search-input:focus { border-color: #0070d1; box-shadow: 0 0 12px rgba(0, 112, 209, 0.4); }
        .stats-counter { color: #38bdf8; font-weight: 600; font-size: 14px; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 18px; 
        }
        
        .card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            overflow: hidden;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, border-color 0.2s;
            height: 100%;
        }

        .card:hover { transform: translateY(-4px); border-color: #0070d1; }
        
        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid #334155;
            display: block;
        }

        .card-body { 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex-grow: 1;
        }
        
        .badge { 
            display: inline-block; 
            font-size: 11px; 
            background: #0070d1; 
            color: #fff; 
            padding: 3px 8px; 
            border-radius: 4px; 
            margin-bottom: 8px; 
            width: fit-content; 
            font-weight: 600;
        }

        .card h3 { 
            font-size: 15px; 
            color: #ffffff; 
            margin-bottom: 8px; 
            line-height: 1.3; 
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card p { 
            font-size: 12px; 
            color: #94a3b8; 
            margin-bottom: 14px; 
            line-height: 1.4; 
            height: 34px;
            overflow: hidden;
        }
        
        .btn-whatsapp { 
            background: #25d366; 
            color: #fff; 
            text-decoration: none; 
            text-align: center; 
            padding: 9px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: bold; 
            transition: background 0.2s;
            display: block;
        }

        .btn-whatsapp:hover { background: #1da851; }

        footer { text-align: center; padding: 20px; margin-top: 40px; font-size: 13px; color: #64748b; background: #1e293b; border-top: 1px solid #334155; }
    </style>
</head>
<body>

<header>
    <h1>LABIRENT CLUB</h1>
    <p>Rəqəmsal PS4 Oyun Kataloqu (500 Ədəd)</p>
</header>

<nav>
    <a href="index.html">💻 PC Proqramları</a>
    <a href="ps4.html" class="active">🎮 PS4 Oyunları</a>
    <a href="ps3.html">🎮 PS3 Bölməsi</a>
    <a href="haqqimizda.html">ℹ️ Haqqımızda</a>
</nav>

<div class="container">
    <div class="search-area">
        <input type="text" id="searchInput" class="search-input" onkeyup="filterGames()" placeholder="PS4 oyunu axtar (Məs: GTA 5, FIFA, God of War, Spider-Man)...">
        <div class="stats-counter" id="statsCounter">Ümumi PS4 Oyun Sayı: 500</div>
    </div>

    <div class="grid" id="gamesGrid">
        <!-- 500 Dənə PS4 Oyunu Yüklənir -->
    </div>
</div>

<footer>
    <p>© 2026 LABIRENT CLUB - Bütün hüquqlar qorunur.</p>
</footer>

<script>
    // ÖZ WHATSAPP NÖMRƏNİ BURAYA YAZ
    const whatsappNumber = "994556383363"; 

    const basePS4Games = [
        "Grand Theft Auto V", "God of War Ragnarök", "Red Dead Redemption 2", "eFootball PES 2021", 
        "EA SPORTS FC 24", "The Last of Us Part II", "Marvel's Spider-Man", "Mortal Kombat 11", 
        "Cyberpunk 2077", "Call of Duty: Modern Warfare", "Assassin's Creed Valhalla", "UFC 4", 
        "Need for Speed Heat", "Resident Evil 4 Remake", "Uncharted 4: A Thief's End", "Ghost of Tsushima", 
        "Horizon Forbidden West", "Elden Ring", "Tekken 7", "The Witcher 3: Wild Hunt", "Battlefield V", 
        "Far Cry 6", "Batman: Arkham Knight", "Bloodborne", "Sekiro: Shadows Die Twice", "Devil May Cry 5", 
        "Monster Hunter: World", "Final Fantasy VII Remake", "God of War (2018)", "Death Stranding", 
        "DOOM Eternal", "Mafia: Definitive Edition", "Watch Dogs 2", "Fallout 4", "Hitman 3", 
        "Overwatch 2", "NBA 2K24", "WWE 2K23", "Gran Turismo Sport", "Dirt 5", "Crash Bandicoot 4", 
        "Spyro Reignited Trilogy", "Ratchet & Clank", "LittleBigPlanet 3", "It Takes Two", "A Way Out", 
        "Detroit: Become Human", "Until Dawn", "Days Gone", "Infamous Second Son"
    ];

    const genres = ["Aksiyon", "Açıq Dünya", "Macəra", "İdman / Futbol", "Döyüş", "RPG", "Yarış", "Atışma (FPS)", "Qorxu"];
    const prefixes = ["Ultimate Edition", "Remastered", "Gold Edition", "Chronicles", "Reloaded", "Legacy", "Origins", "Evolutions"];

    // %100 Yüklənən və Xətasız SVG Afişa Generatoru
    function generateCleanPoster(title, id) {
        const cleanTitle = title.replace(/[^a-zA-Z0-9\s]/g, '').trim();
        const colors = [
            ["#0f172a", "#0070d1"],
            ["#1e1b4b", "#4338ca"],
            ["#14532d", "#15803d"],
            ["#701a75", "#a21caf"],
            ["#7c2d12", "#c2410c"]
        ];
        const selectedColor = colors[id % colors.length];

        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="350" viewBox="0 0 300 350">
            <defs>
                <linearGradient id="g${id}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:${selectedColor[0]};stop-opacity:1" />
                    <stop offset="100%" style="stop-color:${selectedColor[1]};stop-opacity:1" />
                </linearGradient>
            </defs>
            <rect width="100%" height="100%" fill="url(#g${id})" />
            <rect x="12" y="12" width="276" height="326" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4" rx="8"/>
            <text x="50%" y="25%" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">PS4 OFFICIAL</text>
            <text x="50%" y="50%" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">${cleanTitle.substring(0, 20)}</text>
            <text x="50%" y="82%" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">LABIRENT CLUB</text>
        </svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function getExact500Games() {
        let list = [];
        let index = 1;

        basePS4Games.forEach(title => {
            let g = genres[index % genres.length];
            list.push({
                id: index,
                name: `${index}. ${title}`,
                genre: g,
                img: generateCleanPoster(title, index),
                desc: `${title} — PS4 üçün tam tənzimlənmiş və rəsmi oyun versiyası.`
            });
            index++;
        });

        while(index <= 500) {
            let baseName = basePS4Games[index % basePS4Games.length];
            let pref = prefixes[index % prefixes.length];
            let fullName = `${baseName} ${pref}`;
            let g = genres[index % genres.length];

            list.push({
                id: index,
                name: `${index}. ${fullName}`,
                genre: g,
                img: generateCleanPoster(fullName, index),
                desc: `${fullName} — PS4 konsolunda yüksək keyfiyyətli ${g.toLowerCase()} təcrübəsi.`
            });
            index++;
        }

        return list;
    }

    const all500Games = getExact500Games();

    function renderGames(data) {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';

        data.forEach(game => {
            const card = document.createElement('div');
            card.className = 'card';

            const message = encodeURIComponent(`Salam, LABIRENT CLUB! Mən PS4 üçün "${game.name}" oyununu əldə etmək istəyirəm.`);
            const waLink = `https://wa.me/${whatsappNumber}?text=${message}`;

            card.innerHTML = `
                <img src="${game.img}" alt="${game.name}" class="card-img">
                <div class="card-body">
                    <div>
                        <span class="badge">${game.genre}</span>
                        <h3>${game.name}</h3>
                        <p>${game.desc}</p>
                    </div>
                    <a href="${waLink}" target="_blank" class="btn-whatsapp">
                        📱 Əldə et
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById('statsCounter').innerText = `Göstərilən PS4 Oyun Sayı: ${data.length} / 500`;
    }

    function filterGames() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let filtered = all500Games.filter(g => 
            g.name.toLowerCase().includes(input) || 
            g.genre.toLowerCase().includes(input)
        );
        renderGames(filtered);
    }

    renderGames(all500Games);
</script>

</body>
</html>
