        .search-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-input { 
            width: 100%; 
            max-width: 600px; 
            padding: 13px 20px; 
            font-size: 15px; 
            background: #1e293b;
            color: #fff;
            border: 2px solid #334155; 
            border-radius: 25px; 
            outline: none; 
            transition: all 0.3s; 
        }

        .search-input:focus { border-color: #0070d1; box-shadow: 0 0 12px rgba(0, 112, 209, 0.4); }
        .stats-counter { color: #38bdf8; font-weight: 600; font-size: 14px; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 18px; 
        }
        
        .card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            overflow: hidden;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, border-color 0.2s;
            height: 100%;
        }

        .card:hover { transform: translateY(-4px); border-color: #0070d1; }
        
        .card-img-wrapper {
            width: 100%;
            height: 280px;
            background-color: #0b1120;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-bottom: 1px solid #334155;
            display: block;
        }

        .card-body { 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex-grow: 1;
        }
        
        .badge { 
            display: inline-block; 
            font-size: 11px; 
            background: #0070d1; 
            color: #fff; 
            padding: 3px 8px; 
            border-radius: 4px; 
            margin-bottom: 8px; 
            width: fit-content; 
            font-weight: 600;
        }

        .card h3 { 
            font-size: 15px; 
            color: #ffffff; 
            margin-bottom: 8px; 
            line-height: 1.3; 
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card p { 
            font-size: 12px; 
            color: #94a3b8; 
            margin-bottom: 14px; 
            line-height: 1.4; 
            height: 48px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        
        .btn-whatsapp { 
            background: #25d366; 
            color: #fff; 
            text-decoration: none; 
            text-align: center; 
            padding: 9px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: bold; 
            transition: background 0.2s;
            display: block;
        }

        .btn-whatsapp:hover { background: #1da851; }

        footer { text-align: center; padding: 20px; margin-top: 40px; font-size: 13px; color: #64748b; background: #1e293b; border-top: 1px solid #334155; }

    function renderGames(data) {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';

        data.forEach(game => {
            const card = document.createElement('div');
            card.className = 'card';

            const message = encodeURIComponent(`Salam, LABIRENT CLUB! Mən PS4 üçün "${game.title}" oyununu əldə etmək istəyirəm.`);
            const waLink = `https://wa.me/${whatsappNumber}?text=${message}`;

            card.innerHTML = `
                <div class="card-img-wrapper">
                    <img src="${game.img}" alt="${game.title}" class="card-img" loading="lazy">
                </div>
                <div class="card-body">
                    <div>
                        <span class="badge">${game.genre}</span>
                        <h3>${game.id}. ${game.title}</h3>
                        <p>${game.desc}</p>
                    </div>
                    <a href="${waLink}" target="_blank" class="btn-whatsapp">
                        📱 Əldə et
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById('statsCounter').innerText = `Mövcud Oyun Sayı: ${data.length}`;
    }

    function filterGames() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let filtered = ps4Games.filter(g => 
            g.title.toLowerCase().includes(input) || 
            g.genre.toLowerCase().includes(input) ||
            g.desc.toLowerCase().includes(input)
        );
        renderGames(filtered);
    }

    renderGames(ps4Games);
